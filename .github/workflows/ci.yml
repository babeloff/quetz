name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test_quetz:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test_database: [sqlite, postgres]
        db_init: [use-migrations, create-tables]
    env:
      TEST_DB_BACKEND: ${{ matrix.test_database }}
      QUETZ_TEST_DBINIT: ${{ matrix.db_init }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      GCS_TOKEN: /tmp/quetz-gcs-token.json
      S3_ACCESS_KEY: ${{ secrets.s3_access_key }}
      S3_SECRET_KEY: ${{ secrets.s3_secret_key }}
      S3_ENDPOINT: https://s3.sbg.cloud.ovh.net/
      S3_REGION: sbg
      S3_BUCKET_NAME: quetz
      QUETZ_IS_TEST: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.2
          environments: dev
          locked: true
      - name: Configure test credentials and database
        env:
          GCS_TOKEN_CONTENT: ${{ secrets.gcs_token_content }}
        run: |
          if [ -n "$GCS_TOKEN_CONTENT" ]; then
            printf '%s' "$GCS_TOKEN_CONTENT" > "$GCS_TOKEN"
            echo 'GCS_PROJECT=qc-oss-mamba-org-quetz-dev' >> "$GITHUB_ENV"
          fi
          if [ "$TEST_DB_BACKEND" = postgres ]; then
            echo 'QUETZ_TEST_DATABASE=postgresql://postgres:mysecretpassword@localhost:5432/postgres' >> "$GITHUB_ENV"
          fi
      - name: Start services with Podman
        run: bash scripts/ci-services.sh start
      - name: Test server
        run: pixi run --locked -e dev test --cov-config=pyproject.toml --cov=quetz --cov-report=xml --capture=no
      - name: Test plugins
        run: bash scripts/test-plugins.sh
      - name: Stop services
        if: always()
        run: bash scripts/ci-services.sh stop
      - uses: codecov/codecov-action@v7.1.1
        with:
          files: coverage.xml

  test_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.2
          environments: release
          locked: true
      - run: pixi run --locked -e release check-python
      - run: pixi publish --path . --target-dir dist/conda
