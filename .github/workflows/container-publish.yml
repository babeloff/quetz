name: Publish release to GHCR and prefix.dev

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.2
          environments: release
          locked: true
      - name: Download and verify released artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          pixi run --locked -e release python -c 'import os; from quetz._version import __version__; assert os.environ["RELEASE_TAG"] == "v" + __version__'
          gh release download "$RELEASE_TAG" --dir dist/release --pattern '*.conda' --pattern '*.tar.gz' --pattern '*.tgz' --pattern 'SHA256SUMS*'
          (cd dist/release && for manifest in SHA256SUMS*; do sha256sum --check "$manifest"; done)
          platforms=(--platform linux-64 --platform osx-64)
          if [[ -f dist/release/SHA256SUMS-osx-arm64 ]]; then
            platforms+=(--platform osx-arm64)
          fi
          if compgen -G 'dist/release/*.tgz' > /dev/null; then
            platforms+=(--include-chart)
          fi
          pixi run --locked -e release prepare-release "${platforms[@]}"
      - name: Mirror released packages to prefix.dev
        env:
          PREFIX_API_KEY: ${{ secrets.PREFIX_DEV_TOKEN }}
        run: pixi upload prefix --channel mesoforge dist/release/*.conda
      - name: Build and publish image with Podman
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_TAG"
          printf '%s' "$REGISTRY_TOKEN" | podman login ghcr.io --username "$REGISTRY_USERNAME" --password-stdin
          podman build -f Containerfile -t "$image" .
          podman push "$image"
      - name: Log out
        if: always()
        run: podman logout ghcr.io
