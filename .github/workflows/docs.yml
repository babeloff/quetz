name: AsciiDoc documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.84.2
          environments: docs
          locked: true
      - run: pixi run --locked -e docs docs
      - uses: actions/upload-artifact@v4
        with:
          name: DocumentationHTML
          path: docs/build/
