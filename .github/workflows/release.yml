name: Release source and conda packages

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-64
            runner: ubuntu-latest
            prefix: linux64_
          - platform: osx-64
            runner: macos-15-intel
            prefix: osx64_
          - platform: osx-arm64
            runner: macos-15
            prefix: osxarm64_
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.84.2
          environments: release
          locked: true
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: pixi run --locked -e release python -c 'import os; from quetz._version import __version__; assert os.environ["RELEASE_TAG"] == "v" + __version__'
      - name: Build native package into local directory
        env:
          PLATFORM: ${{ matrix.platform }}
          BUILD_PREFIX: ${{ matrix.prefix }}
        run: pixi run --locked -e release build-conda --target-platform "$PLATFORM" --build-string-prefix "$BUILD_PREFIX"
      - uses: actions/upload-artifact@v4
        with:
          name: conda-${{ matrix.platform }}
          path: dist/release/*.conda
          if-no-files-found: error

  release:
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.84.2
          environments: release
          locked: true
      - uses: actions/download-artifact@v4
        with:
          pattern: conda-*
          merge-multiple: true
          path: dist/release
      - run: pixi run --locked -e release prepare-release
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/release/*.conda dist/release/*.tar.gz dist/release/SHA256SUMS --verify-tag --title "Quetz $RELEASE_TAG" --notes "OIDC authentication and provider-managed QEP 1 permissions. Includes source and native conda packages for linux-64, osx-64 and osx-arm64. Container publication and prefix.dev mirroring are separate manual operations."
