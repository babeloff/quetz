name: Release source and conda packages

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-64
            runner: ubuntu-latest
            prefix: linux64_
          - platform: osx-64
            runner: macos-15-intel
            prefix: osx64_
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.2
          environments: release
          locked: true
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: pixi run --locked -e release python -c 'import os; from quetz._version import __version__; assert os.environ["RELEASE_TAG"] == "v" + __version__'
      - name: Build native package into local directory
        env:
          PLATFORM: ${{ matrix.platform }}
          BUILD_PREFIX: ${{ matrix.prefix }}
        run: pixi run --locked -e release build-conda --target-platform "$PLATFORM" --build-string-prefix "$BUILD_PREFIX"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: conda-${{ matrix.platform }}
          path: dist/release/*.conda
          if-no-files-found: error

  release:
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.2
          environments: release
          locked: true
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: conda-*
          merge-multiple: true
          path: dist/release
      - name: Assemble release and optional Helm chart
        run: |
          chart_args=()
          if [[ -f docs/source/_examples/kubernetes/helm/quetz/Chart.yaml ]]; then
            pixi run --locked -e release build-helm
            chart_args+=(--include-chart)
          fi
          pixi run --locked -e release prepare-release --platform linux-64 --platform osx-64 "${chart_args[@]}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          artifacts=(dist/release/*.conda dist/release/*.tar.gz dist/release/SHA256SUMS)
          if compgen -G 'dist/release/*.tgz' > /dev/null; then
            artifacts+=(dist/release/*.tgz)
          fi
          gh release create "$RELEASE_TAG" "${artifacts[@]}" --verify-tag --title "Quetz $RELEASE_TAG" --notes "See CHANGELOG.adoc in the tagged source for release changes. Includes source, a Helm chart when present in the tagged source, and native conda packages for linux-64 and osx-64. Apple Silicon (osx-arm64) is deferred to the separate manual Apple Silicon workflow. Container publication and prefix.dev mirroring are separate manual operations."
