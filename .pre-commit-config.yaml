exclude: (quetz/migrations)
repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: pixi run --locked -e lint ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: pixi run --locked -e lint ruff format --check
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: pixi run --locked -e lint mypy --show-error-codes --implicit-optional
        language: system
        files: ^quetz/
        types: [python]
