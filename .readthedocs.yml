version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  jobs:
    create_environment:
      - curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION=v0.84.2 bash
    install:
      - $HOME/.pixi/bin/pixi install --locked -e docs
    build:
      html:
        - $HOME/.pixi/bin/pixi run --locked -e docs docs-site --output-dir $READTHEDOCS_OUTPUT/html
