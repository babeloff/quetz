services:
  web:
    image: localhost/quetz-dev
    container_name: quetz-web
    ports:
    - 8000:8000
    build:
      context: .
      dockerfile: ./containers/Containerfile
    environment:
    - HTTPX_LOG_LEVEL=TRACE
    command:
    - sh
    - -c
    - ./containers/wait-for-postgres.sh database && quetz start /quetz-deployment
      --host 0.0.0.0 --port 8000 --reload
    depends_on:
      database:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    volumes:
    - ./quetz:/code/quetz:z
    - quetz_deployment:/quetz-deployment
    env_file:
    - containers/postgres.env
  init-db:
    image: localhost/quetz-dev
    command:
    - sh
    - -c
    - ./containers/wait-for-postgres.sh database && quetz create /quetz-deployment
      --copy-conf /code/containers/config.toml --exists-ok && quetz init-db /quetz-deployment
    depends_on:
      database:
        condition: service_healthy
    volumes:
    - ./quetz:/code/quetz:z
    - quetz_deployment:/quetz-deployment
    env_file:
    - containers/postgres.env
    build:
      context: .
      dockerfile: ./containers/Containerfile
  database:
    image: docker.io/library/postgres:16
    volumes:
    - ./containers/postgres.conf:/etc/postgresql/postgresql.conf:z
    env_file:
    - containers/postgres.env
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 2s
      timeout: 5s
      retries: 30
  prometheus:
    image: docker.io/prom/prometheus
    volumes:
    - ./containers/prometheus.yml:/etc/prometheus/prometheus.yml:z
  grafana:
    image: docker.io/grafana/grafana
    ports:
    - 3000:3000
    volumes:
    - ./containers/graphana_datasources.yml:/etc/grafana/provisioning/datasources/datasource.yaml:z
    env_file:
    - containers/grafana.env
  jupyterhub:
    build:
      context: containers
      dockerfile: Containerfile.jupyterhub
    command: jupyterhub --debug
    ports:
    - 8001:8000
  nginx:
    image: docker.io/library/nginx:stable
    container_name: quetz-nginx
    entrypoint:
    - nginx
    - -g
    - daemon off;
    ports:
    - 8080:8080
    depends_on:
    - web
    volumes:
    - ./containers/nginx.conf:/etc/nginx/nginx.conf:z
    - quetz_deployment:/quetz-deployment
volumes:
  quetz_deployment: null
