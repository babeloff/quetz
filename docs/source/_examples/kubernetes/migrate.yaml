# tag::kubernetes-migration[]
apiVersion: batch/v1
kind: Job
metadata:
  name: quetz-migrate-0130
  namespace: quetz
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quetz
    spec:
      serviceAccountName: quetz
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: quetz-data
      - name: config
        configMap:
          name: quetz-config
      - name: tmp
        emptyDir:
          sizeLimit: 2Gi
      terminationGracePeriodSeconds: 60
      restartPolicy: Never
      containers:
      - image: registry.example.org/quetz:v0.13.0
        imagePullPolicy: IfNotPresent
        env:
        - name: QUETZ_CONFIG_FILE
          value: /etc/quetz/config.toml
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: FORWARDED_ALLOW_IPS
          value: 10.244.0.0/16
        envFrom:
        - secretRef:
            name: quetz-runtime
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /etc/quetz
          readOnly: true
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 1Gi
        name: migrate
        args:
        - quetz
        - init-db
        - /data
        - --create-deployment
# end::kubernetes-migration[]
