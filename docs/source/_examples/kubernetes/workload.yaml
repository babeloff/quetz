# tag::kubernetes-workload[]
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quetz
  namespace: quetz
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: quetz
      app.kubernetes.io/component: server
  template:
    metadata:
      labels: *id001
    spec:
      serviceAccountName: quetz
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: quetz-data
      - name: config
        configMap:
          name: quetz-config
      - name: tmp
        emptyDir:
          sizeLimit: 2Gi
      terminationGracePeriodSeconds: 60
      containers:
      - image: registry.example.org/quetz:v0.13.0
        imagePullPolicy: IfNotPresent
        env:
        - name: QUETZ_CONFIG_FILE
          value: /etc/quetz/config.toml
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: FORWARDED_ALLOW_IPS
          value: 10.244.0.0/16
        envFrom:
        - secretRef:
            name: quetz-runtime
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /etc/quetz
          readOnly: true
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 1Gi
        name: quetz
        args:
        - quetz
        - start
        - /data
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        ports:
        - name: http
          containerPort: 8000
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          timeoutSeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          timeoutSeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: quetz
  namespace: quetz
spec:
  selector:
    app.kubernetes.io/name: quetz
  ports:
  - port: 8000
    targetPort: http
    name: http
# end::kubernetes-workload[]
