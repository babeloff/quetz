[package]
name = "quetz-current-repodata"
version = "0.0.0"

[package.build]
backend = { name = "pixi-build-python", version = "0.8.*" }

[package.build.config]
extra-input-globs = ["quetz_current_repodata/templates/**/*", "quetz_current_repodata/migrations/*.mako"]

[package.host-dependencies]
python = "3.11.*"
setuptools = ">=41,<81"
wheel = "*"
uv = "*"

[package.run-dependencies]
python = ">=3.11"
quetz-server = "*"
py-rattler = "0.29.*"
