[package]
name = "quetz-mamba-solve"
version = "0.0.0"

[package.build]
backend = { name = "pixi-build-python", version = "0.8.*" }

[package.build.config]
extra-input-globs = ["quetz_mamba_solve/templates/**/*", "quetz_mamba_solve/migrations/*.mako"]

[package.host-dependencies]
python = "3.11.*"
setuptools = ">=41,<81"
wheel = "*"
uv = "*"

[package.run-dependencies]
python = ">=3.7"
quetz-server = "*"
"pixi" = ">=0.84.2"
"toml" = "*"
